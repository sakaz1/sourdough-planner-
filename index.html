<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sourdough Bake Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Sourdough Bake Planner</h1>

    <section aria-labelledby="recipe-heading">
      <h2 id="recipe-heading">Recipe calculator</h2>
      <form id="recipe-form" novalidate>
        <fieldset>
          <legend>Flours</legend>
          <div id="flours"></div>
          <button type="button" id="add-flour" class="secondary">+ Add flour</button>
        </fieldset>

        <div class="field">
          <label for="water">Water (g)</label>
          <input id="water" name="water" type="number" min="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="starter">Starter, 100% hydration (g)</label>
          <input id="starter" name="starter" type="number" min="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="salt">Salt (g)</label>
          <input id="salt" name="salt" type="number" min="0" step="any" inputmode="decimal">
        </div>
      </form>

      <ul id="errors" class="errors" role="alert"></ul>

      <div id="results" hidden>
        <table>
          <caption>Baker's percentages are relative to the listed flour.</caption>
          <thead>
            <tr><th scope="col">Ingredient</th><th scope="col">Weight</th><th scope="col">Baker's %</th></tr>
          </thead>
          <tbody id="result-rows"></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="schedule-heading">
      <h2 id="schedule-heading">Schedule planner</h2>
      <form id="schedule-form" novalidate>
        <div class="field">
          <label for="out-of-oven">Bread out of the oven at</label>
          <input id="out-of-oven" name="outOfOven" type="datetime-local">
        </div>
        <div class="field">
          <label for="room-temp">Room temperature (&deg;C)</label>
          <input id="room-temp" name="roomTemp" type="number" step="any" inputmode="decimal">
        </div>
        <div class="field checkbox">
          <input id="cold-retard" name="coldRetard" type="checkbox">
          <label for="cold-retard">Cold retard in the fridge (12 h)</label>
        </div>
      </form>

      <ul id="schedule-errors" class="errors" role="alert"></ul>

      <div id="schedule-results" hidden>
        <p id="bulk-summary" class="bulk-summary"></p>
        <p id="bulk-note" class="note"></p>
        <ul id="schedule-warnings" class="warnings"></ul>
        <ol id="timeline" class="timeline"></ol>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
